# pnpm 10+ refuses to run dependency lifecycle scripts by default.
#   electron            -> postinstall downloads the runtime binary (required to run)
#   esbuild             -> installs the platform-native binary (required to build)
#   electron-winstaller -> 只在生成 Squirrel.Windows 安装包时用到；
#                          本项目用 NSIS（见 package.json 的 win.target），不需要它。
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
